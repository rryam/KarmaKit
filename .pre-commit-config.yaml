repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
  - repo: local
    hooks:
      - id: swift-format-lint
        name: swift-format lint
        entry: bash -c 'if command -v swift-format >/dev/null 2>&1; then swift-format lint --strict --recursive Package.swift Sources Tests; elif command -v xcrun >/dev/null 2>&1; then xcrun swift-format lint --strict --recursive Package.swift Sources Tests; else echo "swift-format unavailable, skipping"; fi'
        language: system
        files: \.(swift)$
        pass_filenames: false
