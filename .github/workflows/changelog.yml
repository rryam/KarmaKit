name: Changelog

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - '.github/**'

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require CHANGELOG update for source changes
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(Sources/|Package\.swift)'; then
            if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^CHANGELOG.md'; then
              echo "::warning::Source changes should include a CHANGELOG.md entry when user-visible"
            fi
          fi
