name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted Xcode 27 / Swift 6.4 runner (jaxs-macbook-air).
# Fork PRs are blocked from persistent self-hosted infrastructure.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer

jobs:
  core-and-memory:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version
      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests
      - name: Build all test targets
        run: |
          mkdir -p .build-metrics
          START=$(date +%s)
          swift build --build-tests
          echo $(( $(date +%s) - START )) > .build-metrics/build-seconds.txt
      - name: Run default and memory tests
        run: |
          mkdir -p .test-metrics
          ATTEMPTS=0
          MAX_ATTEMPTS=2
          until ./scripts/run-tests-with-coverage.sh; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [[ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]]; then
              echo "Tests failed after ${MAX_ATTEMPTS} attempt(s)"
              exit 1
            fi
            echo "::warning::Test run failed; retrying (${ATTEMPTS}/${MAX_ATTEMPTS}) for flake detection"
          done
        env:
          COREAGENT_COVERAGE_THRESHOLD: 50
      - name: Upload build and test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-core
          path: |
            .build-metrics/
            .test-metrics/

  providers:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Test every provider trait
        run: swift test --traits AllProviders

  talon-channels:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Build TalonChannels trait target
        run: swift build --traits TalonChannels --build-tests
      - name: Test TalonChannels trait target
        run: swift test --traits TalonChannels

  platform-builds:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, xcode27]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=visionOS
    steps:
      - uses: actions/checkout@v4
      - name: Verify Xcode 27
        shell: bash
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Build package products
        run: >-
          xcodebuild build
          -scheme CoreAgent-Package
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO

  ci-gate:
    name: CI status
    runs-on: ubuntu-latest
    needs:
      - core-and-memory
      - providers
      - talon-channels
      - platform-builds
    if: always()
    steps:
      - name: Evaluate CI results
        run: |
          # Skipped jobs (fork PRs) count as success for the gate.
          if [[ "${{ needs.core-and-memory.result }}" != "success" && "${{ needs.core-and-memory.result }}" != "skipped" ]]; then
            echo "core-and-memory failed: ${{ needs.core-and-memory.result }}"
            exit 1
          fi
          if [[ "${{ needs.talon-channels.result }}" != "success" && "${{ needs.talon-channels.result }}" != "skipped" ]]; then
            echo "talon-channels failed: ${{ needs.talon-channels.result }}"
            exit 1
          fi
          # ADVISORY (not required) until Xcode 27 GA + matched deps:
          #  - providers: pinned foundation-models-utilities may not compile against beta SDK
          #  - platform-builds: iOS/visionOS share the same SDK skew surface
          # RE-REQUIRE both (hard exit 1) once the dep compiles against GA SDK.
          if [[ "${{ needs.providers.result }}" != "success" && "${{ needs.providers.result }}" != "skipped" ]]; then
            echo "::warning::providers job is advisory (not required) pending Xcode 27 GA + a foundation-models-utilities revision that compiles against the GA SDK."
          fi
          if [[ "${{ needs.platform-builds.result }}" != "success" && "${{ needs.platform-builds.result }}" != "skipped" ]]; then
            echo "::warning::platform-builds job is advisory (not required) pending a matched Xcode 27 + macOS 27 GA toolchain."
          fi
          if [[ "${{ needs.core-and-memory.result }}" == "skipped" ]]; then
            echo "CI jobs skipped (untrusted fork PR); gate passes without self-hosted execution"
          fi
          echo "CI gate passed"
