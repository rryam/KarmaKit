name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-27:
    runs-on: macos-26
    outputs:
      available: ${{ steps.detect.outputs.available }}
    steps:
      - name: Detect Xcode 27
        id: detect
        shell: bash
        run: |
          if find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub's macos-26 image does not yet include Xcode 27."
          fi

  core-and-memory:
    needs: xcode-27
    if: needs.xcode-27.outputs.available == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        shell: bash
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | sort | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Check formatting
        run: xcrun swift-format lint --strict --recursive Package.swift Sources Tests
      - name: Build all test targets
        run: |
          mkdir -p .build-metrics
          START=$(date +%s)
          swift build --build-tests
          echo $(( $(date +%s) - START )) > .build-metrics/build-seconds.txt
      - name: Run default and memory tests
        run: |
          mkdir -p .test-metrics
          ATTEMPTS=0
          MAX_ATTEMPTS=2
          until ./scripts/run-tests-with-coverage.sh; do
            ATTEMPTS=$((ATTEMPTS + 1))
            if [[ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]]; then
              echo "Tests failed after ${MAX_ATTEMPTS} attempt(s)"
              exit 1
            fi
            echo "::warning::Test run failed; retrying (${ATTEMPTS}/${MAX_ATTEMPTS}) for flake detection"
          done
        env:
          COREAGENT_COVERAGE_THRESHOLD: 50
      - name: Upload build and test metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-metrics-core
          path: |
            .build-metrics/
            .test-metrics/

  providers:
    needs: xcode-27
    if: needs.xcode-27.outputs.available == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        shell: bash
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | sort | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
      - name: Test every provider trait
        run: swift test --traits AllProviders

  platform-builds:
    needs: xcode-27
    if: needs.xcode-27.outputs.available == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        destination:
          - generic/platform=iOS
          - generic/platform=visionOS
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27
        shell: bash
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_27*.app' | sort | tail -1)"
          test -n "$XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
      - name: Build package products
        run: >-
          xcodebuild build
          -scheme CoreAgent-Package
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO

  hosted-runner-notice:
    needs: xcode-27
    if: needs.xcode-27.outputs.available != 'true'
    runs-on: macos-26
    steps:
      - name: Report unavailable toolchain
        run: |
          echo "### Xcode 27 CI is waiting on the GitHub-hosted runner image." >> "$GITHUB_STEP_SUMMARY"
          echo "The workflow will enable all build and test jobs automatically when Xcode 27 appears under /Applications." >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: CI status
    runs-on: ubuntu-latest
    needs:
      - xcode-27
      - core-and-memory
      - providers
      - platform-builds
      - hosted-runner-notice
    if: always()
    steps:
      - name: Evaluate CI results
        run: |
          if [[ "${{ needs.xcode-27.result }}" != "success" ]]; then
            echo "Xcode detection failed"
            exit 1
          fi
          if [[ "${{ needs.xcode-27.outputs.available }}" == "true" ]]; then
            if [[ "${{ needs.core-and-memory.result }}" != "success" ]]; then exit 1; fi
            if [[ "${{ needs.providers.result }}" != "success" ]]; then exit 1; fi
            if [[ "${{ needs.platform-builds.result }}" != "success" ]]; then exit 1; fi
          else
            if [[ "${{ needs.hosted-runner-notice.result }}" != "success" ]]; then exit 1; fi
          fi
          echo "CI gate passed"
