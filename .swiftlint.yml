# SwiftLint configuration for CoreAgent
# https://github.com/realm/SwiftLint

included:
  - Package.swift
  - Sources
  - Tests

excluded:
  - .build

disabled_rules:
  - trailing_comma
  - vertical_whitespace

line_length:
  warning: 140
  error: 200
  ignores_urls: true

type_name:
  min_length: 2
  max_length: 60

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y

cyclomatic_complexity:
  warning: 20
  error: 35

function_body_length:
  warning: 100
  error: 200

file_length:
  warning: 1200
  error: 2000

type_body_length:
  warning: 600
  error: 1000

nesting:
  type_level: 3

reporter: xcode
